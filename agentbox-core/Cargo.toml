[package]
name = "agentbox-core"
version = "0.1.0"
edition = "2021"
description = "Core Rust runtime for the agentbox Python sandbox"
license = "MIT"
repository = "https://github.com/takurot/enter-sandbox"
homepage = "https://github.com/takurot/enter-sandbox"

[lib]
name = "agentbox_core"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310"] }
wasmtime = "29.0"
wasmtime-wasi = "29.0"
wasi-common = "29.0"
anyhow = "1.0"
tempfile = "3.14"

[dev-dependencies]
criterion = "0.5"
libc = "0.2"

[[bench]]
name = "cold_start"
harness = false

[[bench]]
name = "memory_usage"
harness = false

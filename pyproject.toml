[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "agentbox"
version = "0.1.0"
authors = [
    { name = "Project EnterSandBox" },
]
description = "High-performance AI Agent Sandbox"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["sandbox", "wasi", "wasmtime", "security", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/takurot/enter-sandbox"
Repository = "https://github.com/takurot/enter-sandbox"
Issues = "https://github.com/takurot/enter-sandbox/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.3",
]

[tool.maturin]
features = ["extension-module"]
# The module name in Python (the .so/.pyd file)
module-name = "agentbox._core"
# Where the python code lives
python-source = "python"
manifest-path = "agentbox-core/Cargo.toml"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
